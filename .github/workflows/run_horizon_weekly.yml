name: Weekly Horizon Europe Scraper

# Cadência semanal, e não diária: o dataset de origem tem ~126 MB e muda pouco de
# um dia para o outro. Por isso este fluxo fica fora de scripts/run_all_flows.py.
on:
  schedule:
    # Segundas às 04:00 UTC (01:00 em Brasília), depois do scraper diário.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-horizon:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Horizon Europe Flow
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # Ver run_scraper.yml: provedor de reserva, secret opcional.
        API_KEY: ${{ secrets.API_KEY }}
        OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
        # Divisões do Horizon Europe a indexar. `HORIZON` cobre o programa
        # inteiro, porque a comparação é por prefixo — foi a decisão de
        # 2026-07-31. Para restringir, defina a variável de repositório
        # HORIZON_DIVISIONS com os códigos separados por vírgula.
        HORIZON_DIVISIONS: ${{ vars.HORIZON_DIVISIONS || 'HORIZON' }}
      run: |
        python -m src.flows.ingest_horizon_flow

    - name: Realign edital status with deadlines
      run: |
        python scripts/curate_output.py --refresh-status

    # Ver a justificativa em run_scraper.yml: preserva o resultado parcial sem
    # esconder a falha — o job segue vermelho.
    - name: Commit and Push JSON Results
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Ver a justificativa em run_scraper.yml: sem o `registry` inteiro, o
        # índice de recusados não persiste e o OCR se repete a cada execução.
        git add data/output registry || true
        git diff --staged --quiet || git commit -m "chore: atualiza chamadas do Horizon Europe [skip ci]"
        git push
